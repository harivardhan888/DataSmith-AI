
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataSmith AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <h1>DataSmith AI</h1>
            </div>
            <div class="status-indicator">Online</div>
        </header>

        <!-- Chat Area -->
        <main id="chat-container">
            <div class="message assistant">
                <div class="avatar">AI</div>
                <div class="bubble">
                    <p>Hello! I am DataSmith AI. I can analyze texts, images, audio, and code. Upload a file or just chat with me.</p>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer>
            <div class="input-container">
                <input type="file" id="file-upload" hidden accept=".jpg,.jpeg,.png,.pdf,.wav,.mp3">
                <button id="attach-btn" title="Upload File">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <div id="file-preview" class="hidden">
                    <span id="file-name">file.txt</span>
                    <button id="remove-file">×</button>
                </div>
                <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn" title="Send">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
